<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano Interactivo Moderno</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .container {
            text-align: center;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            max-width: 850px;
            width: 95%;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        /* Estructura del Piano */
        .piano {
            position: relative;
            display: flex;
            justify-content: center;
            background: #090d16;
            padding: 20px 15px 15px 15px;
            border-radius: 16px;
            box-shadow: inset 0 4px 6px rgba(0, 0, 0, 0.6), 0 10px 20px rgba(0,0,0,0.3);
            border: 2px solid #334155;
            user-select: none;
            width: fit-content;
            margin: 0 auto;
        }

        .key {
            position: relative;
            cursor: pointer;
            border-radius: 0 0 10px 10px;
            transition: background 0.1s, transform 0.05s, box-shadow 0.1s;
        }

        /* Teclas Blancas (ancho exacto 56px + 2px de borde total = 58px) */
        .white {
            width: 56px;
            height: 220px;
            background: linear-gradient(to bottom, #ffffff 0%, #e2e8f0 100%);
            border: 1px solid #cbd5e1;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 15px;
            color: #64748b;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .white:hover {
            background: linear-gradient(to bottom, #f1f5f9, #cbd5e1);
        }

        .white.active, .white:active {
            background: linear-gradient(to bottom, #cbd5e1, #94a3b8) !important;
            transform: translateY(3px);
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.2);
        }

        /* Teclas Negras */
        .black {
            position: absolute;
            width: 34px;
            height: 130px;
            background: linear-gradient(to bottom, #334155 0%, #0f172a 100%);
            border-radius: 0 0 8px 8px;
            z-index: 3;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 10px;
            color: #94a3b8;
            font-size: 0.75rem;
            border: 1px solid #1e293b;
            border-top: none;
        }

        .black:hover {
            background: linear-gradient(to bottom, #475569, #1e293b);
        }

        .black.active, .black:active {
            background: linear-gradient(to bottom, #0f172a, #020617) !important;
            transform: translateY(2px);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Posicionamiento exacto alineado al ancho de las teclas blancas (56px) */
        .key[data-note="C#4"] { left: 39px; }
        .key[data-note="D#4"] { left: 95px; }
        .key[data-note="F#4"] { left: 207px; }
        .key[data-note="G#4"] { left: 263px; }
        .key[data-note="A#4"] { left: 319px; }
        .key[data-note="C#5"] { left: 431px; }
        .key[data-note="D#5"] { left: 487px; }

        .key-hint {
            opacity: 0.7;
            font-size: 0.7rem;
            background: rgba(0, 0, 0, 0.08);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .black .key-hint {
            background: rgba(255, 255, 255, 0.15);
            color: #e2e8f0;
        }

        .instructions {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Sintetizador Web</h1>
        <p>Toca haciendo clic con el ratón o usando el teclado de tu ordenador.</p>
        
        <div class="piano" id="piano">
            <div class="key white" data-note="C4" data-key="a"><span class="key-hint">A</span>C4</div>
            <div class="key black" data-note="C#4" data-key="w"><span class="key-hint">W</span></div>
            <div class="key white" data-note="D4" data-key="s"><span class="key-hint">S</span>D4</div>
            <div class="key black" data-note="D#4" data-key="e"><span class="key-hint">E</span></div>
            <div class="key white" data-note="E4" data-key="d"><span class="key-hint">D</span>E4</div>
            <div class="key white" data-note="F4" data-key="f"><span class="key-hint">F</span>F4</div>
            <div class="key black" data-note="F#4" data-key="t"><span class="key-hint">T</span></div>
            <div class="key white" data-note="G4" data-key="g"><span class="key-hint">G</span>G4</div>
            <div class="key black" data-note="G#4" data-key="y"><span class="key-hint">Y</span></div>
            <div class="key white" data-note="A4" data-key="h"><span class="key-hint">H</span>A4</div>
            <div class="key black" data-note="A#4" data-key="u"><span class="key-hint">U</span></div>
            <div class="key white" data-note="B4" data-key="j"><span class="key-hint">J</span>B4</div>
            
            <div class="key white" data-note="C5" data-key="k"><span class="key-hint">K</span>C5</div>
            <div class="key black" data-note="C#5" data-key="o"><span class="key-hint">O</span></div>
            <div class="key white" data-note="D5" data-key="l"><span class="key-hint">L</span>D5</div>
            <div class="key black" data-note="D#5" data-key="p"><span class="key-hint">P</span></div>
            <div class="key white" data-note="E5" data-key="ñ"><span class="key-hint">Ñ</span>E5</div>
        </div>

        <div class="instructions">
            Usa las teclas de tu teclado: <b>A W S E D F T G Y H U J K O L P Ñ</b>
        </div>
    </div>

    <script>
        const frequencies = {
            "C4": 261.63, "C#4": 277.18, "D4": 293.66, "D#4": 311.13,
            "E4": 329.63, "F4": 349.23, "F#4": 369.99, "G4": 392.00,
            "G#4": 415.30, "A4": 440.00, "A#4": 466.16, "B4": 493.88,
            "C5": 523.25, "C#5": 554.37, "D5": 587.33, "D#5": 622.25, "E5": 659.25
        };

        let audioCtx = null;

        function playNote(note) {
            if (!frequencies[note]) return;
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(frequencies[note], audioCtx.currentTime);

            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 1.2);
        }

        const keys = document.querySelectorAll('.key');
        keys.forEach(key => {
            const note = key.getAttribute('data-note');
            key.addEventListener('mousedown', () => {
                playNote(note);
                key.classList.add('active');
            });
            key.addEventListener('mouseup', () => key.classList.remove('active'));
            key.addEventListener('mouseleave', () => key.classList.remove('active'));
        });

        const keyMap = {};
        keys.forEach(key => {
            const k = key.getAttribute('data-key');
            if (k) keyMap[k] = key.getAttribute('data-note');
        });

        window.addEventListener('keydown', (e) => {
            const note = keyMap[e.key.toLowerCase()];
            if (note && !e.repeat) {
                playNote(note);
                const keyElement = document.querySelector(`.key[data-note="${note}"]`);
                if (keyElement) keyElement.classList.add('active');
            }
        });

        window.addEventListener('keyup', (e) => {
            const note = keyMap[e.key.toLowerCase()];
            if (note) {
                const keyElement = document.querySelector(`.key[data-note="${note}"]`);
                if (keyElement) keyElement.classList.remove('active');
            }
        });
    </script>
</body>
</html>
